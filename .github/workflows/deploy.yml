# 자동 배포 워크플로
#
# (1) 원본 저장소(kcozy11-prog/case-manager)
#     main 브랜치에 push(또는 PR 병합)될 때마다 빌드하여 gh-pages 브랜치에 올린다.
#     로컬의 `npm run deploy`와 같은 도구(gh-pages 패키지)로 같은 브랜치에 올리므로
#     GitHub Pages 설정(Source: gh-pages 브랜치)은 그대로 둔다.
#     Firebase 웹 설정은 저장소에 적지 않고, Firebase가 공개로 제공하는 프로젝트 설정 주소
#     (https://<projectId>.firebaseapp.com/__/firebase/init.json)에서 배포 시점에 받아 쓴다.
#     값이 하나라도 비어 있으면 빌드 전에 중단되어 잘못된 앱이 배포되지 않는다.
#     사건 데이터 보호는 Firestore 보안 규칙(본인 uid만 읽기·쓰기)과 Google 로그인으로 이루어진다.
#
# (2) 템플릿 복사본(다른 변호사의 저장소)
#     저장소 변수(Variables)에 VITE_FIREBASE_API_KEY 등이 설정된 경우에만 실행되며,
#     GitHub Pages(GitHub Actions 방식)로 배포한다. 종전과 같다.
name: 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # (1) 원본 저장소 → gh-pages 브랜치
  deploy-original:
    if: github.repository == 'kcozy11-prog/case-manager'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FIREBASE_PROJECT_ID: case-manager-74bcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Firebase 공개 설정 받기
        run: |
          set -euo pipefail
          curl -fsS "https://${FIREBASE_PROJECT_ID}.firebaseapp.com/__/firebase/init.json" -o /tmp/firebase-init.json
          for key in apiKey authDomain projectId storageBucket messagingSenderId appId; do
            value="$(jq -r ".${key} // empty" /tmp/firebase-init.json)"
            if [ -z "${value}" ]; then
              echo "::error::Firebase 설정에 ${key} 값이 없습니다. 배포를 중단합니다."
              exit 1
            fi
            echo "::add-mask::${value}"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done
          if [ "$(jq -r '.projectId' /tmp/firebase-init.json)" != "${FIREBASE_PROJECT_ID}" ]; then
            echo "::error::projectId 가 ${FIREBASE_PROJECT_ID} 와 다릅니다. 배포를 중단합니다."
            exit 1
          fi
        id: firebase
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ steps.firebase.outputs.apiKey }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ steps.firebase.outputs.authDomain }}
          VITE_FIREBASE_PROJECT_ID: ${{ steps.firebase.outputs.projectId }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ steps.firebase.outputs.storageBucket }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.firebase.outputs.messagingSenderId }}
          VITE_FIREBASE_APP_ID: ${{ steps.firebase.outputs.appId }}
      - name: 빌드 결과 확인
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "${FIREBASE_PROJECT_ID}" dist/assets/*.js || { echo "::error::빌드 결과에 Firebase 설정이 없습니다."; exit 1; }
      - name: gh-pages 브랜치에 배포
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx gh-pages -d dist --nojekyll \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -m "자동 배포: ${GITHUB_SHA}"

  # (2) 템플릿 복사본 → GitHub Pages (GitHub Actions 방식)
  build-deploy:
    if: github.repository != 'kcozy11-prog/case-manager' && vars.VITE_FIREBASE_API_KEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
