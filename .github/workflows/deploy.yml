# 자동 배포 워크플로
#
# (1) 원본 저장소(kcozy11-prog/case-manager)
#     main 브랜치에 push(또는 PR 병합)될 때마다 빌드하여 gh-pages 브랜치에 올린다.
#     로컬의 `npm run deploy`와 같은 도구(gh-pages 패키지)로 같은 브랜치에 올리므로
#     GitHub Pages 설정(Source: gh-pages 브랜치)은 그대로 둔다.
#     Firebase 웹 설정은 저장소 소스에 적지 않는다.
#       - 저장소 변수(Variables)에 VITE_FIREBASE_* 가 등록되어 있으면 그 값을 쓴다.
#       - 없으면 현재 배포본(gh-pages 브랜치의 앱 파일)에 이미 들어 있는 같은 값을 읽어 쓴다.
#         (이 값은 배포된 앱에 그대로 포함되는 공개 값이다. 데이터 보호는 Firestore 보안 규칙과
#          Google 로그인이 담당한다.)
#     값이 하나라도 비면 빌드 전에 중단되어 잘못된 앱이 배포되지 않는다.
#
# (2) 템플릿 복사본(다른 변호사의 저장소)
#     저장소 변수(Variables)에 VITE_FIREBASE_API_KEY 등이 설정된 경우에만 실행되며,
#     GitHub Pages(GitHub Actions 방식)로 배포한다. 종전과 같다.
name: 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # (1) 원본 저장소 → gh-pages 브랜치
  deploy-original:
    if: github.repository == 'kcozy11-prog/case-manager'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FIREBASE_PROJECT_ID: case-manager-74bcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Firebase 설정 준비
        id: firebase
        env:
          VAR_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VAR_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VAR_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VAR_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VAR_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VAR_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${VAR_API_KEY}" ]; then
            echo "저장소 변수(Variables)의 Firebase 설정을 사용합니다."
            apiKey="${VAR_API_KEY}"; authDomain="${VAR_AUTH_DOMAIN}"; projectId="${VAR_PROJECT_ID}"
            storageBucket="${VAR_STORAGE_BUCKET}"; messagingSenderId="${VAR_MESSAGING_SENDER_ID}"; appId="${VAR_APP_ID}"
          else
            echo "저장소 변수가 없어 현재 배포본(gh-pages 브랜치)에서 Firebase 설정을 읽습니다."
            git fetch --depth=1 origin gh-pages
            bundle="$(git ls-tree -r --name-only FETCH_HEAD | grep -E '^assets/index-.*\.js$' | head -1 || true)"
            if [ -z "${bundle}" ]; then
              echo "::error::gh-pages 브랜치에서 앱 파일(assets/index-*.js)을 찾지 못했습니다. 저장소 Settings → Secrets and variables → Actions → Variables 에 VITE_FIREBASE_* 여섯 값을 등록하세요."
              exit 1
            fi
            git show "FETCH_HEAD:${bundle}" > /tmp/prev-bundle.js
            config="$(grep -oE '\{[^{}]*"?projectId"?:"'"${FIREBASE_PROJECT_ID}"'"[^{}]*\}' /tmp/prev-bundle.js | head -1 || true)"
            if [ -z "${config}" ]; then
              echo "::error::현재 배포본에서 Firebase 설정을 찾지 못했습니다. 저장소 Settings → Secrets and variables → Actions → Variables 에 VITE_FIREBASE_* 여섯 값을 등록하세요."
              exit 1
            fi
            get() { printf '%s' "${config}" | grep -oE '"?'"$1"'"?:"[^"]*"' | head -1 | sed -E 's/^"?[A-Za-z]+"?:"//; s/"$//' || true; }
            apiKey="$(get apiKey)"; authDomain="$(get authDomain)"; projectId="$(get projectId)"
            storageBucket="$(get storageBucket)"; messagingSenderId="$(get messagingSenderId)"; appId="$(get appId)"
          fi
          for key in apiKey authDomain projectId storageBucket messagingSenderId appId; do
            value="${!key}"
            if [ -z "${value}" ]; then
              echo "::error::Firebase 설정에 ${key} 값이 없습니다. 배포를 중단합니다."
              exit 1
            fi
            echo "::add-mask::${value}"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done
          if [ "${projectId}" != "${FIREBASE_PROJECT_ID}" ]; then
            echo "::error::projectId 가 ${FIREBASE_PROJECT_ID} 와 다릅니다. 배포를 중단합니다."
            exit 1
          fi
          echo "Firebase 설정 6개 항목 확인 완료."
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ steps.firebase.outputs.apiKey }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ steps.firebase.outputs.authDomain }}
          VITE_FIREBASE_PROJECT_ID: ${{ steps.firebase.outputs.projectId }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ steps.firebase.outputs.storageBucket }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.firebase.outputs.messagingSenderId }}
          VITE_FIREBASE_APP_ID: ${{ steps.firebase.outputs.appId }}
      - name: 빌드 결과 확인
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q "${FIREBASE_PROJECT_ID}" dist/assets/*.js || { echo "::error::빌드 결과에 Firebase 설정이 없습니다."; exit 1; }
      - name: gh-pages 브랜치에 배포
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx gh-pages -d dist --nojekyll \
            -u "github-actions <github-actions@users.noreply.github.com>" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -m "자동 배포: ${GITHUB_SHA}"

  # (2) 템플릿 복사본 → GitHub Pages (GitHub Actions 방식)
  build-deploy:
    if: github.repository != 'kcozy11-prog/case-manager' && vars.VITE_FIREBASE_API_KEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
